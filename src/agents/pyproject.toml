[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64"]

[tool.setuptools]
packages = ["commerce_agents"]
include-package-data = false

[tool.setuptools.package-data]
commerce_agents = ["configs/*.yml"]

[project]
name = "acp-agents"
version = "0.1.0"
description = "Promotion, messaging, search, and recommendation services for Retail Agentic Commerce"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "arize-phoenix-otel==0.14.0",
    "fastapi==0.133.0",
    "httpx==0.28.1",
    "langchain-core==1.4.9",
    "langchain-nvidia-ai-endpoints==1.4.3",
    "langgraph==1.2.9",
    "opentelemetry-api==1.39.1",
    "pydantic==2.12.5",
    "pymilvus==2.6.9",
    "pyyaml==6.0.3",
    "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pyright>=1.1.0",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportGeneralTypeIssues = "warning"
reportCallIssue = "warning"

[tool.uv]
managed = true
