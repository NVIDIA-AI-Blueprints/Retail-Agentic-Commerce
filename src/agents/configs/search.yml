# RAG Search Agent (Lightweight)
# ==============================
# Purpose: Provide top-k product search results from Milvus embeddings.
#
# Usage:
#   nat serve --config_file configs/search.yml --port 8005
#   nat run --config_file configs/search.yml --input '{"query": "lightweight summer tee", "limit": 3}'

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: info
    tracing:
      phoenix:
        _type: phoenix
        project: "search-agent"
        endpoint: ${PHOENIX_ENDPOINT:-http://localhost:6006/v1/traces}

# =============================================================================
# EMBEDDERS - Semantic embeddings for product search
# Endpoint and model can be configured via environment variables:
# - NIM_EMBED_BASE_URL: Public endpoint (default) or local NIM URL
# - NIM_EMBED_MODEL_NAME: Embedding model name
# =============================================================================
embedders:
  product_embedder:
    _type: nim
    base_url: ${NIM_EMBED_BASE_URL:-https://integrate.api.nvidia.com/v1}
    model_name: ${NIM_EMBED_MODEL_NAME:-nvidia/nemotron-3-embed-1b}
    truncate: "END"

# =============================================================================
# RETRIEVERS - Vector search for candidate products
# =============================================================================
retrievers:
  product_retriever:
    _type: milvus_retriever
    uri: ${MILVUS_URI:-http://localhost:19530}
    collection_name: "product_catalog"
    embedding_model: product_embedder
    top_k: 10

# =============================================================================
# FUNCTIONS - Product search tool
# =============================================================================
functions:
  product_search:
    _type: nat_retriever
    retriever: product_retriever
    topic: Search product catalog for items matching the user query

# =============================================================================
# EVALUATION LLMs - Judge model for eval evaluators, not the main workflow
# Uses a larger model than the agent for unbiased evaluation scoring
# =============================================================================
llms:
  nim_eval_llm:
    _type: nim
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    temperature: 0.0
    max_tokens: 1024
  nim_trajectory_eval_llm:
    _type: nim
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    temperature: 0.0
    max_tokens: 2048

# =============================================================================
# MAIN WORKFLOW - Deterministic retrieval adapter
#
# Apps SDK search is a transactional product-discovery route. Passing retriever
# results through an LLM tool-calling loop adds latency and can exceed the MCP
# request timeout even after retrieval succeeds. The workflow therefore returns
# the normalized retriever records directly; the merchant API remains the
# product-data source of truth during Apps SDK enrichment.
# =============================================================================
workflow:
  _type: deterministic_product_search
  name: product_search_agent
  workflow_alias: search_agent
  retrieval_tool_name: product_search
  max_results: 50

# =============================================================================
# EVALUATION & PROFILING
# Run with: nat eval --config_file configs/search.yml
# =============================================================================
eval:
  general:
    output_dir: ./.tmp/eval/search_agent
    verbose: true
    max_concurrency: 2
    dataset:
      _type: json
      file_path: data/eval/search_eval.json
      id_key: "id"
      structure:
        question_key: question
        answer_key: answer
    profiler:
      token_uniqueness_forecast: true
      workflow_runtime_forecast: true
      compute_llm_metrics: true
      csv_exclude_io_text: true
      prompt_caching_prefixes:
        enable: true
        min_frequency: 0.1
      bottleneck_analysis:
        enable_nested_stack: true
      concurrency_spike_analysis:
        enable: true
        spike_threshold: 5

  evaluators:
    accuracy:
      _type: ragas
      metric: AnswerAccuracy
      llm_name: nim_eval_llm
    relevance:
      _type: ragas
      metric: ContextRelevance
      llm_name: nim_eval_llm
    trajectory:
      _type: trajectory
      llm_name: nim_trajectory_eval_llm
