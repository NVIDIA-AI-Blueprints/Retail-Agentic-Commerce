# Runs the Retail Agentic Commerce QA suite (UI, native + Apps SDK modes) from the
# shared QA image against the Docker Compose deployment (hosted NVIDIA endpoints, no GPU).
#
# Required repository secrets:
#   NGC_API_KEY            build.nvidia.com API key (nvapi-...), passed as NVIDIA_API_KEY.
#   TEST_DOCKER_PULL_KEY   NVIDIA API key with pull access to the QA image.
# Optional SMTP secrets (mail step skipped if any are missing):
#   SMTP_USERNAME, SMTP_PASSWORD, SMTP_MAIL_TO, SMTP_MAIL_FROM

name: Blueprint QA

on:
  push:
    branches: [main, swqa/enable-qa]
  workflow_dispatch:
    inputs:
      test_image:
        description: QA test image
        required: false
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retail-agentic-commerce:
    name: Retail Agentic Commerce
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NVIDIA_API_KEY: ${{ secrets.NGC_API_KEY }}
      QA_TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
      COMPOSE: docker compose -f docker-compose.infra.yml -f docker-compose.yml
      NIM_LLM_BASE_URL: https://integrate.api.nvidia.com/v1
      NIM_LLM_MODEL_NAME: nvidia/nemotron-3.5-lightning-30b-a3b
      NIM_EMBED_BASE_URL: https://integrate.api.nvidia.com/v1
      NIM_EMBED_MODEL_NAME: nvidia/nemotron-3.5-embed-1b
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          [ -n "${NVIDIA_API_KEY:-}" ] || { echo "::error::NGC_API_KEY secret missing"; exit 1; }
          [ -n "${TEST_DOCKER_PULL_KEY:-}" ] || { echo "::error::TEST_DOCKER_PULL_KEY secret missing"; exit 1; }

      - name: Pull QA test image
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          docker pull "${QA_TEST_IMAGE}"

      - name: Deploy Retail Agentic Commerce
        run: |
          set -euo pipefail
          docker network create acp-infra-network || true
          cp env.example .env
          sed -i "s|^NVIDIA_API_KEY=.*|NVIDIA_API_KEY=${NVIDIA_API_KEY}|" .env
          ${COMPOSE} up --build -d

      - name: Wait for milvus-seeder
        run: |
          set -euo pipefail
          cid="$(${COMPOSE} ps -a -q milvus-seeder)"
          [ -n "${cid}" ] || { echo "::error::milvus-seeder container not found"; exit 1; }
          code="$(timeout 1800 docker wait "${cid}")" || { echo "::error::milvus-seeder did not finish in 30 min"; exit 1; }
          echo "milvus-seeder exit code: ${code}"
          [ "${code}" = "0" ] || { ${COMPOSE} logs --tail 200 milvus-seeder; exit 1; }

      - name: Health check
        run: |
          set -euo pipefail
          for url in http://localhost/api/health http://localhost/psp/health http://localhost/apps-sdk/health http://localhost/; do
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null "${url}"; then echo "OK ${url}"; break; fi
              [ "${i}" -lt 60 ] || { echo "::error::${url} not healthy after 10 min"; exit 1; }
              sleep 10
            done
          done
          ${COMPOSE} ps

      - name: Run Retail Agentic Commerce tests
        run: |
          set -euo pipefail
          mkdir -p reports
          docker run --rm --net=host \
            -v "$(pwd)/reports:/reports" \
            "${QA_TEST_IMAGE}" \
            pytest testcases/retail_agentic_commerce/test_retail_agentic_commerce_ui.py \
              -m retail_agentic_commerce \
              --retail-agentic-commerce-url=http://localhost \
              --reruns=1 --reruns-delay=20 \
              --disable-warnings -v --timeout=900 \
              --html=/reports/retail-agentic-commerce-test.html --self-contained-html
          [ -f reports/retail-agentic-commerce-test.html ] || { echo "::error::no test report"; exit 1; }

      - name: Capture container logs
        if: failure()
        run: |
          mkdir -p reports
          ${COMPOSE} ps -a > reports/compose-ps.txt 2>&1 || true
          ${COMPOSE} logs --no-color > reports/compose-logs.txt 2>&1 || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-agentic-commerce-test
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          ${COMPOSE} down -v 2>/dev/null || true
          rm -f .env
          docker rmi "${QA_TEST_IMAGE}" 2>/dev/null || true
          docker image prune -f 2>/dev/null || true

      - name: Detect SMTP
        id: smtp
        if: always()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_MAIL_TO: ${{ secrets.SMTP_MAIL_TO }}
          SMTP_MAIL_FROM: ${{ secrets.SMTP_MAIL_FROM }}
        run: |
          [ -n "${SMTP_USERNAME:-}" ] && [ -n "${SMTP_PASSWORD:-}" ] \
            && [ -n "${SMTP_MAIL_TO:-}" ] && [ -n "${SMTP_MAIL_FROM:-}" ] \
            && echo "enabled=true" >> "$GITHUB_OUTPUT" \
            || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Send mail
        if: always() && steps.smtp.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: ${{ secrets.SMTP_MAIL_TO }}
          from: ${{ secrets.SMTP_MAIL_FROM }}
          html_body: |
            <p>Workflow for <strong>${{ github.repository }}</strong> finished: <strong>${{ job.status }}</strong></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
