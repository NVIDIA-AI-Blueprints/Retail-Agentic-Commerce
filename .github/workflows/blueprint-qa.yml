# Deploys the Retail Agentic Commerce stack via Docker Compose, waits for it
# to become healthy, then runs the UI E2E test suite from the shared QA image.
#
# Required repository secrets:
#   NGC_API_KEY            NVIDIA API key used to pull images and populate
#                          NVIDIA_API_KEY in .env.
#   TEST_DOCKER_PULL_KEY   NVIDIA API key with pull access to
#                          nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image.
#                          If unset, the test step is skipped.
#
# Optional SMTP secrets (mail step skipped if any are missing):
#   SMTP_USERNAME, SMTP_PASSWORD, SMTP_MAIL_TO, SMTP_MAIL_FROM

name: Blueprint QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retail-agentic-commerce-ui:
    name: Retail Agentic Commerce UI E2E
    runs-on: arc-runners-org-nvidia-ai-bp-2-gpu
    timeout-minutes: 480
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
      QA_TEST_IMAGE: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest
      UI_URL: http://localhost
    steps:
      - uses: actions/checkout@v4

      - name: Deploy stack
        run: |
          set -euo pipefail
          : "${NGC_API_KEY:?NGC_API_KEY secret missing}"
          cp env.example .env
          sed -i "s|^NVIDIA_API_KEY=.*|NVIDIA_API_KEY=${NGC_API_KEY}|" .env
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          docker network create acp-infra-network 2>/dev/null || true
          docker compose -f docker-compose.infra.yml -f docker-compose.yml up -d --build

          echo "Waiting for the merchant API and the UI to answer (up to 10 min)..."
          if ! timeout 600 bash -c 'until curl -fsS "${UI_URL}/api/health" > /dev/null 2>&1 && curl -fsS -o /dev/null "${UI_URL}/"; do sleep 10; done'; then
            echo "::error::Merchant API or UI root page did not answer within 10 minutes."
            docker compose -f docker-compose.infra.yml -f docker-compose.yml ps --all
            exit 1
          fi

          echo "Waiting for Milvus catalog seeding to finish (up to 10 min)..."
          if ! SEEDER_EXIT_CODE="$(timeout 600 docker wait milvus-seeder)"; then
            echo "::error::Milvus catalog seeding did not finish within 10 minutes."
            docker compose -f docker-compose.infra.yml -f docker-compose.yml logs --tail 200 milvus-seeder
            exit 1
          fi
          if [ "${SEEDER_EXIT_CODE}" != "0" ]; then
            echo "::error::Milvus catalog seeding failed with exit code ${SEEDER_EXIT_CODE}."
            docker compose -f docker-compose.infra.yml -f docker-compose.yml logs --tail 200 milvus-seeder
            exit 1
          fi

          echo "Waiting for NAT agents to become healthy (up to 10 min)..."
          if ! timeout 600 bash -c 'until docker compose -f docker-compose.infra.yml -f docker-compose.yml exec -T merchant python -c "import urllib.request as u; [u.urlopen(url, timeout=5).read() for url in (\"http://promotion-agent:8002/health\", \"http://post-purchase-agent:8003/health\", \"http://recommendation-agent:8004/health\", \"http://search-agent:8005/health\")]" > /dev/null 2>&1; do sleep 10; done'; then
            echo "::error::One or more NAT agents did not become healthy within 10 minutes."
            docker compose -f docker-compose.infra.yml -f docker-compose.yml ps --all
            docker compose -f docker-compose.infra.yml -f docker-compose.yml logs --tail 200 \
              promotion-agent post-purchase-agent recommendation-agent search-agent
            exit 1
          fi

          docker compose -f docker-compose.infra.yml -f docker-compose.yml exec -T merchant \
            python -c "import urllib.request as u; print('promotion', u.urlopen('http://promotion-agent:8002/health', timeout=5).status); print('post-purchase', u.urlopen('http://post-purchase-agent:8003/health', timeout=5).status); print('recommendation', u.urlopen('http://recommendation-agent:8004/health', timeout=5).status); print('search', u.urlopen('http://search-agent:8005/health', timeout=5).status)"
          echo "Stack and agents are ready."

      - name: Exercise NAT agent workflows
        run: |
          set -euo pipefail
          docker compose -f docker-compose.infra.yml -f docker-compose.yml exec -T merchant \
            python - < .github/scripts/check_nat_agents.py

      - name: Run UI automation tests
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          [ -n "${TEST_DOCKER_PULL_KEY:-}" ] || exit 0
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          docker pull "${QA_TEST_IMAGE}"
          docker run --rm --net=host -v "$(pwd):/workspace" "${QA_TEST_IMAGE}" \
            pytest -m retail_agentic_commerce \
              --retail-agentic-commerce-url="${UI_URL}" \
              --disable-warnings -v --timeout=240 \
              --html=/workspace/retail-agentic-commerce-ui-test.html --self-contained-html

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          docker compose -f docker-compose.infra.yml -f docker-compose.yml ps --all \
            > ci-diagnostics/docker-compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.infra.yml -f docker-compose.yml logs \
            --no-color --timestamps --tail 300 \
            apps-sdk merchant psp ui nginx promotion-agent post-purchase-agent \
            recommendation-agent search-agent milvus-seeder milvus-standalone \
            milvus-etcd milvus-minio phoenix \
            > ci-diagnostics/service-logs.txt 2>&1 || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-agentic-commerce-ui-test
          path: |
            retail-agentic-commerce-ui-test.html
            ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.infra.yml -f docker-compose.yml down -v --rmi all 2>/dev/null || true
          docker rmi "${QA_TEST_IMAGE}" 2>/dev/null || true
          docker network rm acp-infra-network 2>/dev/null || true
          docker image prune -f

      - name: Detect SMTP
        id: smtp
        if: always()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_MAIL_TO: ${{ secrets.SMTP_MAIL_TO }}
          SMTP_MAIL_FROM: ${{ secrets.SMTP_MAIL_FROM }}
        run: |
          [ -n "${SMTP_USERNAME:-}${SMTP_PASSWORD:-}${SMTP_MAIL_TO:-}${SMTP_MAIL_FROM:-}" ] \
            && [ -n "${SMTP_USERNAME:-}" ] && [ -n "${SMTP_PASSWORD:-}" ] \
            && [ -n "${SMTP_MAIL_TO:-}" ] && [ -n "${SMTP_MAIL_FROM:-}" ] \
            && echo "enabled=true" >> "$GITHUB_OUTPUT" \
            || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Send mail
        if: always() && steps.smtp.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: ${{ secrets.SMTP_MAIL_TO }}
          from: ${{ secrets.SMTP_MAIL_FROM }}
          html_body: |
            <p>Workflow for <strong>${{ github.repository }}</strong> finished: <strong>${{ job.status }}</strong></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
