name: Blueprint QA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_image:
        description: QA test image (nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:<tag>)
        required: false
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -f docker-compose.infra.yml -f docker-compose.yml

jobs:
  retail-agentic-commerce:
    name: Retail Agentic Commerce UI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      QA_TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          [ -n "${NVIDIA_API_KEY:-}" ] || { echo "::error::NVIDIA_API_KEY secret missing"; exit 1; }
          [ -n "${TEST_DOCKER_PULL_KEY:-}" ] || { echo "::error::TEST_DOCKER_PULL_KEY secret missing"; exit 1; }

      - name: Deploy the stack
        run: |
          set -euo pipefail
          docker network create acp-infra-network || true
          ${COMPOSE} up --build -d
          for path in /api/health /psp/health /apps-sdk/health; do
            for _ in $(seq 1 90); do
              curl -fsS "http://localhost${path}" >/dev/null 2>&1 && break
              sleep 10
            done
            curl -fsS "http://localhost${path}" || { echo "::error::http://localhost${path} not healthy"; exit 1; }
            echo
          done
          ${COMPOSE} ps

      - name: Run Retail Agentic Commerce tests
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          docker pull "${QA_TEST_IMAGE}"
          mkdir -p reports
          docker run --rm --network host \
            -v "$(pwd)/reports:/blueprint/reports" \
            -w /app \
            "${QA_TEST_IMAGE}" \
            pytest testcases/retail_agentic_commerce/test_retail_agentic_commerce_ui.py \
              -m retail_agentic_commerce \
              --retail-agentic-commerce-url=http://localhost \
              --reports-dir=/blueprint/reports \
              --html=/blueprint/reports/retail-agentic-commerce-test.html --self-contained-html \
              --disable-warnings -v --timeout=900
          [ -s reports/junit.xml ] || { echo "::error::no test report written"; exit 1; }

      - name: Container logs
        if: failure()
        run: |
          mkdir -p reports
          ${COMPOSE} ps -a > reports/compose-ps.txt 2>&1 || true
          ${COMPOSE} logs --no-color > reports/compose-logs.txt 2>&1 || true
          tail -n 200 reports/compose-logs.txt || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-agentic-commerce-test
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          ${COMPOSE} down -v 2>/dev/null || true
          docker rmi "${QA_TEST_IMAGE}" 2>/dev/null || true
          docker image prune -f 2>/dev/null || true

      - name: Detect SMTP
        id: smtp
        if: always()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_MAIL_TO: ${{ secrets.SMTP_MAIL_TO }}
          SMTP_MAIL_FROM: ${{ secrets.SMTP_MAIL_FROM }}
        run: |
          [ -n "${SMTP_USERNAME:-}" ] && [ -n "${SMTP_PASSWORD:-}" ] \
            && [ -n "${SMTP_MAIL_TO:-}" ] && [ -n "${SMTP_MAIL_FROM:-}" ] \
            && echo "enabled=true" >> "$GITHUB_OUTPUT" \
            || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Send mail
        if: always() && steps.smtp.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: ${{ secrets.SMTP_MAIL_TO }}
          from: ${{ secrets.SMTP_MAIL_FROM }}
          html_body: |
            <p>Workflow for <strong>${{ github.repository }}</strong> finished: <strong>${{ job.status }}</strong></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
