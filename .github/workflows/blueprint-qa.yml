# Runs the Retail Agentic Commerce QA UI suite (blueprint-github-test, marker
# "retail_agentic_commerce and ui") against the full Docker Compose stack.
# Hosted inference (integrate.api.nvidia.com): no GPU needed.
#
# Required repository secrets:
#   NVIDIA_API_KEY         build.nvidia.com API key used by the NAT agents and milvus-seeder.
#   TEST_DOCKER_PULL_KEY   NVIDIA API key with pull access to the QA image.
# Optional SMTP secrets (mail step skipped if any are missing):
#   SMTP_USERNAME, SMTP_PASSWORD, SMTP_MAIL_TO, SMTP_MAIL_FROM

name: Blueprint QA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_image:
        description: QA test image
        required: false
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retail-agentic-commerce:
    name: Retail Agentic Commerce UI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      QA_TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
      COMPOSE_FILES: -f docker-compose.infra.yml -f docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          : "${NVIDIA_API_KEY:?NVIDIA_API_KEY secret missing}"
          : "${TEST_DOCKER_PULL_KEY:?TEST_DOCKER_PULL_KEY secret missing}"

      - name: Deploy stack
        run: |
          set -euo pipefail
          cp env.example .env
          sed -i "s|^NVIDIA_API_KEY=.*|NVIDIA_API_KEY=${NVIDIA_API_KEY}|" .env
          docker network create acp-infra-network || true
          docker compose ${COMPOSE_FILES} up --build -d

      - name: Wait for stack health
        run: |
          set -euo pipefail
          healthy() {
            curl -fsS http://localhost/api/health >/dev/null \
              && curl -fsS http://localhost/psp/health >/dev/null \
              && curl -fsS http://localhost/apps-sdk/health >/dev/null
          }
          for _ in $(seq 1 90); do
            healthy && break
            sleep 10
          done
          healthy || { echo "stack not healthy after 15 min"; exit 1; }
          for _ in $(seq 1 90); do
            state=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' milvus-seeder)
            [ "${state}" = "exited 0" ] && break
            case "${state}" in exited*) echo "milvus-seeder failed: ${state}"; exit 1;; esac
            sleep 10
          done
          [ "$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' milvus-seeder)" = "exited 0" ] \
            || { echo "milvus-seeder did not finish"; exit 1; }
          docker compose ${COMPOSE_FILES} ps

      - name: Run Retail Agentic Commerce UI tests
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          docker pull "${QA_TEST_IMAGE}"
          docker run --rm -i --network host \
            -v "$(pwd):/blueprint" \
            "${QA_TEST_IMAGE}" bash -s <<'DOCKER_SCRIPT'
          set -euo pipefail
          pip install --quiet pytest-timeout
          cd /app
          pytest testcases/retail_agentic_commerce \
            -m "retail_agentic_commerce and ui" \
            --retail-agentic-commerce-url=http://localhost \
            --reruns=1 --reruns-delay=20 \
            --disable-warnings -v --timeout=900 \
            --html=/blueprint/rac-test.html --self-contained-html
          DOCKER_SCRIPT

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          docker compose ${COMPOSE_FILES} ps -a > ci-diagnostics/compose-ps.txt 2>&1 || true
          docker compose ${COMPOSE_FILES} logs --no-color > ci-diagnostics/compose-logs.txt 2>&1 || true
          tail -n 200 ci-diagnostics/compose-logs.txt || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-agentic-commerce-test
          path: |
            rac-test.html
            ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker compose ${COMPOSE_FILES} down -v 2>/dev/null || true
          docker rmi "${QA_TEST_IMAGE}" 2>/dev/null || true
          docker image prune -f 2>/dev/null || true

      - name: Detect SMTP
        id: smtp
        if: always()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_MAIL_TO: ${{ secrets.SMTP_MAIL_TO }}
          SMTP_MAIL_FROM: ${{ secrets.SMTP_MAIL_FROM }}
        run: |
          [ -n "${SMTP_USERNAME:-}" ] && [ -n "${SMTP_PASSWORD:-}" ] \
            && [ -n "${SMTP_MAIL_TO:-}" ] && [ -n "${SMTP_MAIL_FROM:-}" ] \
            && echo "enabled=true" >> "$GITHUB_OUTPUT" \
            || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Send mail
        if: always() && steps.smtp.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: ${{ secrets.SMTP_MAIL_TO }}
          from: ${{ secrets.SMTP_MAIL_FROM }}
          html_body: |
            <p>Workflow for <strong>${{ github.repository }}</strong> finished: <strong>${{ job.status }}</strong></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
